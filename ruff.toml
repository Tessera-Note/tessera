# Настройки линта для Python вне `apps/api`: сейчас это `scripts/`.
#
# Свой файл нужен потому, что ruff берёт настройки из ближайшего вверх
# `pyproject.toml`, а у корня репозитория его нет: настройки приложения лежат в
# `apps/api/pyproject.toml` и на соседние каталоги не распространяются. Без
# этого файла скрипты проверялись бы умолчаниями ruff, и `# noqa` с кодом
# отключённого правила выглядел бы лишним, а импорт своего пакета — сторонним.
#
# Длина строки и версия языка те же, что в `apps/api/pyproject.toml`. Набор
# правил шире на `N`: скрипты наследуют имена методов у библиотечных классов
# (`do_GET` в `stand-cookie.py`), и подавление такого имени должно оставаться
# осмысленным, а не висеть кодом отключённого правила.

line-length = 100
target-version = "py313"

[lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[lint.isort]
# Скрипты обращаются к пакету приложения: `stand-session.py` запускается внутри
# контейнера, где он установлен.
known-first-party = ["tessera_api"]
