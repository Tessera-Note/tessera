# Lint settings for the Python outside `apps/api`: currently that is `scripts/`.
#
# A file of its own is needed because ruff takes its settings from the nearest
# `pyproject.toml` upwards, and the repository root has none: the application
# settings live in `apps/api/pyproject.toml` and do not extend to neighbouring
# directories. Without this file the scripts would be checked with the ruff
# defaults, a `# noqa` carrying the code of a disabled rule would look
# superfluous, and an import of our own package would look third-party.
#
# The line length and the language version are the same as in
# `apps/api/pyproject.toml`. The rule set is wider by `N`: the scripts inherit
# method names from library classes (`do_GET` in `stand-cookie.py`), and
# suppressing such a name has to stay meaningful rather than hang there as the
# code of a disabled rule.

line-length = 100
target-version = "py313"

[lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[lint.isort]
# The scripts call the application package: `stand-session.py` runs inside the
# container, where it is installed.
known-first-party = ["tessera_api"]
