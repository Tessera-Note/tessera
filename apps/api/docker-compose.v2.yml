# Стенд второй версии: приложение вместе со своими базой, Redis и хранилищем.
#
# Это **стенд**, а не боевой состав. Здесь у второй версии всё своё, поэтому её
# можно поднять рядом с первой и ничего ей не сделать: свои тома, свои имена,
# свои порты. На таком составе идёт репетиция переключения.
#
# Для боевого сервера есть `docker-compose.v2.server.yml`: там те же процессы
# приложения, но база, Redis и хранилище — те же, что у первой версии. Иначе
# переключение означало бы переезд данных, а весь порядок перехода построен на
# том, что переезжать нечему.
#
# Прод поднимается корневым docker-compose.yml, и трогать его нельзя, пока v2
# не готов целиком.
#
# Как поднять на своей машине:
#
#     docker compose -f apps/api/docker-compose.v2.yml up -d --build
#
# и открыть http://localhost:8080. Четыре значения обязательны, состав без них
# не разбирается — задать их в `apps/api/.env` (файл в `.gitignore` первой же
# строкой) или передать `--env-file`:
#
#     LOCAL_PORT            порт, на котором вика открывается. Один на всё:
#                           за ним прокси, который разводит запросы по трём
#                           процессам. Умолчание 8080
#     APP_SECRET            подпись токенов входа, не короче 32 знаков.
#                           `openssl rand -hex 32`
#     POSTGRES_PASSWORD     пароль базы; его же берёт база внутреннего сервиса,
#                           если не задан HUB_POSTGRES_PASSWORD
#     MINIO_ROOT_PASSWORD   пароль хранилища вложений
#     COLLAB_INTERNAL_TOKEN общий секрет внутренних маршрутов совместного
#                           редактирования. Только латиница и цифры: значение
#                           уходит заголовком HTTP. `openssl rand -hex 24`
#
# Наружу состав не ходит: почта пишется в журнал (`MAIL_DRIVER=log`), поиск
# идёт своим SearXNG, диаграммы — своим drawio. Единственное исключение —
# провайдер модели для ИИ, и он выключен, пока не задан `AI_DRIVER`.
#
# Имена сервисов и container_name несут префикс проекта: на машине с несколькими
# проектами голое имя `postgres` означает, что второй проект не поднимется, а
# `docker compose down` снесёт чужой контейнер.
#
# Имя проекта задано явно. По умолчанию оно берётся из имени каталога, то есть
# было бы `api`: под этим именем пошли бы префиксы томов и метка
# `com.docker.compose.project`, по которой на этой машине отличают своё от
# чужого при уборке образов.
name: tessera-v2

services:
  # Обратный прокси. На своей машине он нужен по той же причине, что и на
  # сервере: за одним адресом стоят три процесса, и без прокси браузер ходил бы
  # на три разных происхождения, а кука входа стала бы сторонней — её не
  # отправили бы ни к `/api`, ни к `/collab`.
  #
  # Разбор путей тот же, что в боевой настройке, и это намеренно: расхождение
  # означало бы, что проверенное на своей машине не повторяется на сервере.
  tessera-v2-proxy:
    image: nginx:1.29-alpine
    container_name: tessera-v2-proxy
    depends_on:
      - tessera-v2-api
      - tessera-v2-web
      - tessera-v2-collab
      - tessera-v2-drawio
      - tessera-v2-hub
    ports:
      # Единственный порт, который нужен человеку. Остальные публикуются ради
      # осмотра по отдельности; вика открывается здесь.
      - "${LOCAL_PORT:-8080}:80"
    volumes:
      - ../../deploy/nginx/reverse-proxy-v2-local.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  # Редактор диаграмм. Тот же образ, что у первой версии: он встраивается в
  # страницу рамкой, и своей сборки у нас нет.
  #
  # `DRAWIO_SELF_CONTAINED` обязателен: без него редактор тянет из интернета
  # шрифты и заготовки, а развёртывание работает без выхода наружу.
  tessera-v2-drawio:
    image: jgraph/drawio:24.7.17
    container_name: tessera-v2-drawio
    environment:
      DRAWIO_SELF_CONTAINED: "1"
    restart: unless-stopped

  # Преобразование содержимого страниц. Отдельный процесс на Node, потому что
  # схема узлов редактора описана расширениями Tiptap: второе описание той же
  # схемы расходится с первым, а расхождение здесь — порча содержимого, которая
  # не проявляется отказом.
  #
  # **Экземпляр один, и второго заводить нельзя.** Состояние документа живёт в
  # памяти процесса, и рассылки между репликами здесь нет: два человека,
  # попавшие на разные реплики, правили бы разные копии одной страницы и не
  # сошлись бы — молча, без единого отказа. Прежде чем поднимать второй,
  # см. `docs/future-roadmap.md`, раздел о рассылке между репликами.
  tessera-v2-collab:
    build:
      context: ../..
      dockerfile: services/collab/Dockerfile
    container_name: tessera-v2-collab
    environment:
      PORT: 3001
      HOST: 0.0.0.0
      # Куда ходить за правами и записью в базу. Решения о том, кому что можно,
      # принимаются только там.
      API_URL: http://tessera-v2-api:3000
      # Общий секрет внутренних маршрутов. Знаков латиницы: значение уходит
      # заголовком HTTP, а он другого набора не допускает.
      COLLAB_INTERNAL_TOKEN: ${COLLAB_INTERNAL_TOKEN:?COLLAB_INTERNAL_TOKEN обязателен}
      # Допуск подключений без имени документа в адресе. Только на время
      # раскатки при одной реплике; до второй реплики выключается, порядок в
      # docs/v2-migration/09-switchover.md.
      COLLAB_ALLOW_UNNAMED_DOCUMENT: ${COLLAB_ALLOW_UNNAMED_DOCUMENT:-false}
    ports:
      # Канал редактирования открывает браузер, поэтому порт публикуется.
      # Преобразование содержимого на том же порту предназначено только соседям
      # и снаружи закрывается обратным прокси по пути: наружу открыт `/collab`.
      - "3101:3001"
    restart: unless-stopped

  # Накат схемы. Три шага, и порядок между ними обязателен.
  #
  # Atlas в свободной редакции ведёт только таблицы. Всё остальное — расширения,
  # функции, настройка поиска, триггеры и четыре индекса с сортировкой `C` —
  # ведётся обычным SQL по обе стороны от него. Замерено: `schema inspect`
  # рабочей базы не отдаёт ни функций, ни триггеров, ни `COLLATE` у колонки
  # индекса.
  #
  # Почему это здесь, а не в боевом составе. Там база общая с первой версией и
  # уже размечена, а `atlas schema apply` — объявительный: он привёл бы рабочую
  # базу к своему представлению, то есть пересоздал бы четыре индекса без
  # сортировки, молча и с блокировкой. На чистой базе своей машины этой
  # опасности нет.
  tessera-v2-schema-base:
    image: postgres:18-alpine
    container_name: tessera-v2-schema-base
    depends_on:
      tessera-v2-db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD обязателен}
    volumes:
      - ./schema:/schema:ro
    # `atlas_dev` — одноразовая база самого Atlas: в ней он строит желаемое
    # состояние, чтобы сравнить с нынешним. Без функций из baseline он не
    # построит и её: умолчание первичного ключа почти каждой таблицы — вызов
    # `gen_uuid_v7()`.
    entrypoint:
      - sh
      - -c
      - |
        set -e
        # Повторный подъём не должен падать на уже сделанном. Всё в baseline
        # переписываемо (`IF NOT EXISTS`, `OR REPLACE`), кроме настройки поиска:
        # по ней и определяется, применялся ли файл.
        applied() {
          test "$$(psql -h tessera-v2-db -U tessera -d "$$1" -tAc \
            "SELECT count(*) FROM pg_ts_config WHERE cfgname='tessera_search'")" = 1
        }
        applied tessera || psql -h tessera-v2-db -U tessera -d tessera \
          -v ON_ERROR_STOP=1 -f /schema/baseline.sql
        psql -h tessera-v2-db -U tessera -d postgres -tAc \
          "SELECT 1 FROM pg_database WHERE datname='atlas_dev'" | grep -q 1 \
          || psql -h tessera-v2-db -U tessera -d postgres -c "CREATE DATABASE atlas_dev"
        applied atlas_dev || psql -h tessera-v2-db -U tessera -d atlas_dev \
          -v ON_ERROR_STOP=1 -f /schema/baseline.sql
    restart: "no"

  tessera-v2-schema-tables:
    image: arigaio/atlas:latest
    container_name: tessera-v2-schema-tables
    depends_on:
      tessera-v2-schema-base:
        condition: service_completed_successfully
    volumes:
      - ./schema:/schema:ro
    command:
      - schema
      - apply
      - --auto-approve
      - --url
      - postgres://tessera:${POSTGRES_PASSWORD}@tessera-v2-db:5432/tessera?sslmode=disable&search_path=public
      - --to
      - file:///schema/schema.hcl
      - --dev-url
      - postgres://tessera:${POSTGRES_PASSWORD}@tessera-v2-db:5432/atlas_dev?sslmode=disable&search_path=public
      # Четыре индекса с сортировкой `C` Atlas не ведёт: он её не видит и на
      # каждом подъёме удалял бы их как лишние, а следующий шаг создавал бы
      # заново. Перестройка индекса на большой таблице — это блокировка, и
      # получать её при каждом подъёме незачем.
      - --exclude
      - base_properties.idx_base_properties_page_alive
      - --exclude
      - base_rows.idx_base_rows_page_alive
      - --exclude
      - pages.idx_pages_is_base
      - --exclude
      - pages.idx_pages_space_parent_position
    restart: "no"

  # Триггеры и индексы с сортировкой: ссылаются на таблицы, поэтому после Atlas.
  tessera-v2-schema-rest:
    image: postgres:18-alpine
    container_name: tessera-v2-schema-rest
    depends_on:
      tessera-v2-schema-tables:
        condition: service_completed_successfully
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./schema:/schema:ro
    entrypoint:
      - sh
      - -c
      - |
        set -e
        psql -h tessera-v2-db -U tessera -d tessera -v ON_ERROR_STOP=1 -f /schema/after-atlas.sql
    restart: "no"

  tessera-v2-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tessera-v2-api
    depends_on:
      tessera-v2-schema-rest:
        condition: service_completed_successfully
      tessera-v2-minio-init:
        condition: service_completed_successfully
      tessera-v2-collab:
        condition: service_started
      tessera-v2-redis:
        condition: service_started
    environment:
      # Окружение перечисляется поимённо, как в v1, и по той же причине: всё,
      # чего здесь нет, до приложения не доходит. Список сверен с тем, что
      # читает Settings.from_env.
      APP_URL: ${APP_URL:-http://localhost:${LOCAL_PORT:-8080}}
      APP_SECRET: ${APP_SECRET:?APP_SECRET обязателен, не короче 32 символов}
      # Умолчание — своя база стенда. Боевой состав подставляет базу первой
      # версии: у обеих версий она одна, и вписанный сюда литерал сделал бы
      # переключение переездом данных.
      DATABASE_URL: ${DATABASE_URL:-postgresql://tessera:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD обязателен}@tessera-v2-db:5432/tessera}
      REDIS_URL: ${REDIS_URL:-redis://tessera-v2-redis:6379}
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-3000}
      DEBUG_MODE: ${DEBUG_MODE:-}
      # Число доверенных прокси, а не «доверять всей цепочке»: по этому адресу
      # считаются пороги частоты и пишется журнал аудита.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      MAIL_DRIVER: ${MAIL_DRIVER:-log}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@tessera.local}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Tessera}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      # Хранилище вложений. Имена переменных те же, что в v1: одно
      # развёртывание обслуживает обе версии на время перехода.
      STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
      STORAGE_LOCAL_PATH: ${STORAGE_LOCAL_PATH:-/app/data/storage}
      AWS_S3_ENDPOINT: ${AWS_S3_ENDPOINT:-http://tessera-v2-minio:9000}
      AWS_S3_BUCKET: ${MINIO_BUCKET:-tessera}
      AWS_S3_REGION: ${MINIO_REGION:-us-east-1}
      AWS_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-tessera}
      AWS_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD обязателен}
      # MinIO не умеет виртуальные хосты бакетов.
      AWS_S3_FORCE_PATH_STYLE: ${AWS_S3_FORCE_PATH_STYLE:-true}
      # Ключи Google для входа. Общие на установку: обратный адрес
      # регистрируется в консоли Google один и не может нести ни поддомена,
      # ни идентификатора провайдера. Пускать ли через Google, решает строка
      # провайдера в настройках пространства.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      FILE_UPLOAD_SIZE_LIMIT: ${FILE_UPLOAD_SIZE_LIMIT:-50mb}
      # Ввозимый архив крупнее обычного вложения: в нём целое пространство.
      FILE_IMPORT_SIZE_LIMIT: ${FILE_IMPORT_SIZE_LIMIT:-200mb}
      # Провайдер ИИ. Применяется только к пространству, которое не выбрало
      # провайдера само: как только выбрало, отсюда не наследуется ничего,
      # включая имена моделей — они у провайдеров несовместимы.
      AI_DRIVER: ${AI_DRIVER:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OLLAMA_API_URL: ${OLLAMA_API_URL:-}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-}
      AI_COMPLETION_MODEL: ${AI_COMPLETION_MODEL:-}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-}
      # Соседний сервис преобразования содержимого. Схема узлов редактора
      # живёт там, и второй её реализации быть не должно.
      CONTENT_SERVICE_URL: ${CONTENT_SERVICE_URL:-http://tessera-v2-collab:3001}
      # Печать в PDF. Здесь она нужна не меньше, чем разбору очереди: одну
      # страницу приложение печатает само (`api/pdf_export.py`), в очередь
      # уходит только выгрузка пространства. Без адреса человек нажимает «PDF»
      # и получает отказ «переменная должна указывать на службу Gotenberg».
      GOTENBERG_URL: ${GOTENBERG_URL:-http://tessera-v2-gotenberg:3000}
      # Откуда браузер печати берёт страницу отрисовки. Внутреннее имя, а не
      # внешний адрес: наружу он не ходит.
      PDF_RENDER_BASE_URL: ${PDF_RENDER_BASE_URL:-http://tessera-v2-proxy}
      PDF_EXPORT_TIMEOUT: ${PDF_EXPORT_TIMEOUT:-120}
      # Тот же секрет, что у соседа. Пустое значение выключает внутренние
      # маршруты совместного редактирования вовсе.
      COLLAB_INTERNAL_TOKEN: ${COLLAB_INTERNAL_TOKEN:?COLLAB_INTERNAL_TOKEN обязателен}
      # Отметка владения документом в Redis: срок жизни и период продления, мс.
      # Продление обязано быть меньше срока, иначе приложение не поднимется.
      COLLAB_OWNER_TTL_MS: ${COLLAB_OWNER_TTL_MS:-30000}
      COLLAB_OWNER_RENEW_MS: ${COLLAB_OWNER_RENEW_MS:-10000}
      # Приёмник счётчиков установки. Внутри сети развёртывания: наружу
      # телеметрия не уходит. Пустое значение выключает отправку.
      HUB_INTERNAL_URL: ${HUB_INTERNAL_URL:-http://tessera-v2-hub:4000}
      # Тот же сосед, но адресом для браузера: по нему открывается страница
      # выпусков. Внутреннее имя сети в браузере человека не разрешается, а
      # своего порта наружу у соседа нет — он выведен тем же прокси под `/hub`.
      HUB_URL: ${HUB_URL:-http://localhost:${LOCAL_PORT:-8080}/hub}
      DISABLE_TELEMETRY: ${DISABLE_TELEMETRY:-false}
    ports:
      - "3100:3000"
    restart: unless-stopped

  # Экраны. Отдельный процесс, а не часть приложения: это сервер отрисовки на
  # Node, и в одном процессе с Python ему делать нечего.
  #
  # Он же отдаёт страницу отрисовки, которую печатает Gotenberg: разметка
  # страницы живёт здесь, и второй её рисовальщик расходился бы с тем, что
  # человек видит на экране.
  tessera-v2-web:
    build:
      # Корень монорепозитория, а не свой каталог: экраны зависят от пакета
      # расширений записью `workspace:*`, и разрешается она только там, где
      # лежат `pnpm-workspace.yaml` и общий файл блокировки.
      context: ../..
      dockerfile: apps/web/Dockerfile
    container_name: tessera-v2-web
    depends_on:
      - tessera-v2-api
    environment:
      # Два адреса, а не один. Браузер ходит на то же происхождение, что и
      # страница, поэтому здесь пусто; сервер отрисовки ходит к приложению
      # внутренним именем — относительный адрес там уводит запрос обратно в
      # себя и кончается переполнением памяти.
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://tessera-v2-api:3000}
      # Редактор диаграмм открывается рамкой внутри страницы, то есть браузером.
      # Путь, а не адрес: рамка идёт на то же происхождение через прокси.
      PUBLIC_DRAWIO_URL: ${PUBLIC_DRAWIO_URL:-/drawio/}
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      # Экраны отдаёт обратный прокси: наружу открывается только он, а сюда
      # ходит он же по петле.
      - "3102:3000"
    restart: unless-stopped

  # Разбор очереди заданий. Отдельный процесс: задание может выполняться
  # минутами, и выполнение его внутри веб-процесса означает, что выкладка
  # обрывает его на середине.
  tessera-v2-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tessera-v2-worker
    command: ["arq", "tessera_api.worker.WorkerSettings"]
    depends_on:
      - tessera-v2-db
      - tessera-v2-redis
    environment:
      # Адрес, по которому страница открыта в браузере, — и никакой иной.
      # По нему проверяется происхождение при рукопожатии канала событий: при
      # расхождении соединение отвергается молча, страницы работают, а живые
      # обновления просто не приходят. За обратным прокси здесь стоит внешний
      # адрес вики, а не порт на петле. Умолчание — адрес прокси: к самому
      # приложению браузер не обращается ни разу.
      APP_URL: ${APP_URL:-http://localhost:${LOCAL_PORT:-8080}}
      APP_SECRET: ${APP_SECRET:?APP_SECRET обязателен, не короче 32 символов}
      DATABASE_URL: ${DATABASE_URL:-postgresql://tessera:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD обязателен}@tessera-v2-db:5432/tessera}
      REDIS_URL: ${REDIS_URL:-redis://tessera-v2-redis:6379}
      MAIL_DRIVER: ${MAIL_DRIVER:-log}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@tessera.local}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Tessera}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
      STORAGE_LOCAL_PATH: ${STORAGE_LOCAL_PATH:-/app/data/storage}
      AWS_S3_ENDPOINT: ${AWS_S3_ENDPOINT:-http://tessera-v2-minio:9000}
      AWS_S3_BUCKET: ${MINIO_BUCKET:-tessera}
      AWS_S3_REGION: ${MINIO_REGION:-us-east-1}
      AWS_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-tessera}
      AWS_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD обязателен}
      AWS_S3_FORCE_PATH_STYLE: ${AWS_S3_FORCE_PATH_STYLE:-true}
      FILE_UPLOAD_SIZE_LIMIT: ${FILE_UPLOAD_SIZE_LIMIT:-50mb}
      # Ввозимый архив крупнее обычного вложения: в нём целое пространство.
      FILE_IMPORT_SIZE_LIMIT: ${FILE_IMPORT_SIZE_LIMIT:-200mb}
      # Провайдер ИИ. Применяется только к пространству, которое не выбрало
      # провайдера само: как только выбрало, отсюда не наследуется ничего,
      # включая имена моделей — они у провайдеров несовместимы.
      AI_DRIVER: ${AI_DRIVER:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OLLAMA_API_URL: ${OLLAMA_API_URL:-}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-}
      AI_COMPLETION_MODEL: ${AI_COMPLETION_MODEL:-}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-}
      # Соседний сервис преобразования содержимого. Схема узлов редактора
      # живёт там, и второй её реализации быть не должно.
      CONTENT_SERVICE_URL: ${CONTENT_SERVICE_URL:-http://tessera-v2-collab:3001}
      # Печать в PDF. Пустой адрес Gotenberg выключает выгрузку целиком.
      GOTENBERG_URL: ${GOTENBERG_URL:-http://tessera-v2-gotenberg:3000}
      # Откуда браузер печати берёт страницу отрисовки. Внутреннее имя, а не
      # внешний адрес: наружу он не ходит.
      PDF_RENDER_BASE_URL: ${PDF_RENDER_BASE_URL:-http://tessera-v2-proxy}
      PDF_EXPORT_TIMEOUT: ${PDF_EXPORT_TIMEOUT:-120}
    restart: unless-stopped

  # Хранилище вложений, совместимое с протоколом S3.
  tessera-v2-minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: tessera-v2-minio
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-tessera}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD обязателен}
    restart: unless-stopped
    volumes:
      - tessera_v2_minio_data:/data

  # Разовое создание бакета. Такое же, как у первой версии, и по той же
  # причине: MinIO поднимается пустым, бакетов сам не заводит, а приложение их
  # не создаёт. Без этого шага любая загрузка падает с `NoSuchBucket` — и
  # первым это видно на печати в PDF: задание уходит в отказ, а человеку
  # показывается «выгрузка не найдена», по которому причину не угадать.
  tessera-v2-minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: tessera-v2-minio-init
    depends_on:
      - tessera-v2-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-tessera}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD обязателен}
      MINIO_BUCKET: ${MINIO_BUCKET:-tessera}
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set tessera http://tessera-v2-minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do
          echo "жду tessera-v2-minio"; sleep 2;
        done
        mc mb --ignore-existing "tessera/$$MINIO_BUCKET"
        echo "бакет $$MINIO_BUCKET готов"
    restart: "no"

  # Внутренний сервис: версии, телеметрия, документация, лицензия. Написан на
  # Python и Litestar, правки не требует — берётся как есть. Наружу порт не
  # публикуется: к нему ходит только приложение.
  tessera-v2-hub:
    build:
      context: ../../services/hub
    container_name: tessera-v2-hub
    depends_on:
      - tessera-v2-hub-db
    environment:
      HUB_DATABASE_URL: postgresql+asyncpg://tessera_hub:${HUB_POSTGRES_PASSWORD:-${POSTGRES_PASSWORD}}@tessera-v2-hub-db:5432/tessera_hub
      HOST: 0.0.0.0
      PORT: 4000
    restart: unless-stopped

  tessera-v2-hub-db:
    image: postgres:18-alpine
    container_name: tessera-v2-hub-db
    environment:
      POSTGRES_DB: tessera_hub
      POSTGRES_USER: tessera_hub
      POSTGRES_PASSWORD: ${HUB_POSTGRES_PASSWORD:-${POSTGRES_PASSWORD:?POSTGRES_PASSWORD обязателен}}
    restart: unless-stopped
    volumes:
      - tessera_v2_hub_db_data:/var/lib/postgresql

  # Поиск в интернете для агента. Свой сервис, а не чужая услуга: ключа он не
  # требует, счёта в закрытом контуре не заводит и хранить найденное не
  # запрещает. Наружу не публикуется — ходит к нему только приложение.
  tessera-v2-searxng:
    image: searxng/searxng@sha256:f4c8e59de166ed71f6380c0847c312ca51f0d41996e31d0559163b6b09ecde52
    container_name: tessera-v2-searxng
    environment:
      SEARXNG_BASE_URL: http://tessera-v2-searxng:8080/
      SEARXNG_SECRET: ${SEARXNG_SECRET:-tessera-v2-searxng-secret}
    volumes:
      - ../../deploy/searxng:/etc/searxng:ro
    restart: unless-stopped

  # Безголовый Chromium: им и только им печатаются страницы в PDF. Разметка
  # страницы живёт на клиенте, и второй её рисовальщик на сервере расходился бы
  # с тем, что человек видит на экране.
  #
  # Список разрешённых адресов сужен до своего же приложения: браузер печати не
  # должен ходить никуда наружу, иначе ссылка внутри страницы превращает его в
  # средство обхода сети развёртывания.
  #
  # Одним маршрутом отрисовки обойтись нельзя. Страница показывает документ
  # редактором, а он лежит под `/_app/`; без него печатается запасной плоский
  # текст без картинок и таблиц. Вложения приходят из `/api/files/`, словарь
  # интерфейса — из `/locales/`. Всё это на том же узле, и дальше него список
  # не пускает.
  tessera-v2-gotenberg:
    image: gotenberg/gotenberg:8
    container_name: tessera-v2-gotenberg
    command:
      - "gotenberg"
      - "--chromium-allow-list=${PDF_ALLOW_LIST:-^http://tessera-v2-proxy/(pdf-render/|_app/|api/files/|locales/)}"
      - "--chromium-disable-javascript=false"
    restart: unless-stopped

  tessera-v2-db:
    image: pgvector/pgvector:pg18
    container_name: tessera-v2-db
    # Готовность нужна накату схемы: `depends_on` без неё означает лишь
    # «контейнер запущен», а Postgres в этот миг ещё не принимает соединения, и
    # первый же psql падает на отказе в подключении.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tessera -d tessera"]
      interval: 3s
      timeout: 3s
      retries: 20
    environment:
      POSTGRES_DB: tessera
      POSTGRES_USER: tessera
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD обязателен}
    restart: unless-stopped
    volumes:
      - tessera_v2_db_data:/var/lib/postgresql

  tessera-v2-redis:
    image: redis:8
    container_name: tessera-v2-redis
    restart: unless-stopped
    volumes:
      - tessera_v2_redis_data:/data

volumes:
  tessera_v2_db_data:
  tessera_v2_hub_db_data:
  tessera_v2_minio_data:
  tessera_v2_redis_data:
