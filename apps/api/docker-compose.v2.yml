# Стенд второй версии: приложение вместе со своими базой, Redis и хранилищем.
#
# Это **стенд**, а не боевой состав. Здесь у второй версии всё своё, поэтому её
# можно поднять рядом с первой и ничего ей не сделать: свои тома, свои имена,
# свои порты. На таком составе идёт репетиция переключения.
#
# Для боевого сервера есть `docker-compose.v2.server.yml`: там те же процессы
# приложения, но база, Redis и хранилище — те же, что у первой версии. Иначе
# переключение означало бы переезд данных, а весь порядок перехода построен на
# том, что переезжать нечему.
#
# Прод поднимается корневым docker-compose.yml, и трогать его нельзя, пока v2
# не готов целиком.
#
# Имена сервисов и container_name несут префикс проекта: на машине с несколькими
# проектами голое имя `postgres` означает, что второй проект не поднимется, а
# `docker compose down` снесёт чужой контейнер.
#
# Имя проекта задано явно. По умолчанию оно берётся из имени каталога, то есть
# было бы `api`: под этим именем пошли бы префиксы томов и метка
# `com.docker.compose.project`, по которой на этой машине отличают своё от
# чужого при уборке образов.
name: tessera-v2

services:
  # Преобразование содержимого страниц. Отдельный процесс на Node, потому что
  # схема узлов редактора описана расширениями Tiptap: второе описание той же
  # схемы расходится с первым, а расхождение здесь — порча содержимого, которая
  # не проявляется отказом.
  #
  # **Экземпляр один, и второго заводить нельзя.** Состояние документа живёт в
  # памяти процесса, и рассылки между репликами здесь нет: два человека,
  # попавшие на разные реплики, правили бы разные копии одной страницы и не
  # сошлись бы — молча, без единого отказа. Прежде чем поднимать второй,
  # см. `docs/future-roadmap.md`, раздел о рассылке между репликами.
  tessera-v2-collab:
    build:
      context: ../..
      dockerfile: services/collab/Dockerfile
    container_name: tessera-v2-collab
    environment:
      PORT: 3001
      HOST: 0.0.0.0
      # Куда ходить за правами и записью в базу. Решения о том, кому что можно,
      # принимаются только там.
      API_URL: http://tessera-v2-api:3000
      # Общий секрет внутренних маршрутов. Знаков латиницы: значение уходит
      # заголовком HTTP, а он другого набора не допускает.
      COLLAB_INTERNAL_TOKEN: ${COLLAB_INTERNAL_TOKEN:?COLLAB_INTERNAL_TOKEN обязателен}
    ports:
      # Канал редактирования открывает браузер, поэтому порт публикуется.
      # Преобразование содержимого на том же порту предназначено только соседям
      # и снаружи закрывается обратным прокси по пути: наружу открыт `/collab`.
      - "3101:3001"
    restart: unless-stopped

  tessera-v2-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tessera-v2-api
    depends_on:
      - tessera-v2-db
      - tessera-v2-collab
      - tessera-v2-redis
    environment:
      # Окружение перечисляется поимённо, как в v1, и по той же причине: всё,
      # чего здесь нет, до приложения не доходит. Список сверен с тем, что
      # читает Settings.from_env.
      APP_URL: ${APP_URL:-http://localhost:3100}
      APP_SECRET: ${APP_SECRET:?APP_SECRET обязателен, не короче 32 символов}
      # Умолчание — своя база стенда. Боевой состав подставляет базу первой
      # версии: у обеих версий она одна, и вписанный сюда литерал сделал бы
      # переключение переездом данных.
      DATABASE_URL: ${DATABASE_URL:-postgresql://tessera:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD обязателен}@tessera-v2-db:5432/tessera}
      REDIS_URL: ${REDIS_URL:-redis://tessera-v2-redis:6379}
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-3000}
      DEBUG_MODE: ${DEBUG_MODE:-}
      # Число доверенных прокси, а не «доверять всей цепочке»: по этому адресу
      # считаются пороги частоты и пишется журнал аудита.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      MAIL_DRIVER: ${MAIL_DRIVER:-log}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@tessera.local}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Tessera}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      # Хранилище вложений. Имена переменных те же, что в v1: одно
      # развёртывание обслуживает обе версии на время перехода.
      STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
      STORAGE_LOCAL_PATH: ${STORAGE_LOCAL_PATH:-/app/data/storage}
      AWS_S3_ENDPOINT: ${AWS_S3_ENDPOINT:-http://tessera-v2-minio:9000}
      AWS_S3_BUCKET: ${MINIO_BUCKET:-tessera}
      AWS_S3_REGION: ${MINIO_REGION:-us-east-1}
      AWS_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-tessera}
      AWS_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD обязателен}
      # MinIO не умеет виртуальные хосты бакетов.
      AWS_S3_FORCE_PATH_STYLE: ${AWS_S3_FORCE_PATH_STYLE:-true}
      # Ключи Google для входа. Общие на установку: обратный адрес
      # регистрируется в консоли Google один и не может нести ни поддомена,
      # ни идентификатора провайдера. Пускать ли через Google, решает строка
      # провайдера в настройках пространства.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      FILE_UPLOAD_SIZE_LIMIT: ${FILE_UPLOAD_SIZE_LIMIT:-50mb}
      # Ввозимый архив крупнее обычного вложения: в нём целое пространство.
      FILE_IMPORT_SIZE_LIMIT: ${FILE_IMPORT_SIZE_LIMIT:-200mb}
      # Провайдер ИИ. Применяется только к пространству, которое не выбрало
      # провайдера само: как только выбрало, отсюда не наследуется ничего,
      # включая имена моделей — они у провайдеров несовместимы.
      AI_DRIVER: ${AI_DRIVER:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OLLAMA_API_URL: ${OLLAMA_API_URL:-}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-}
      AI_COMPLETION_MODEL: ${AI_COMPLETION_MODEL:-}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-}
      # Соседний сервис преобразования содержимого. Схема узлов редактора
      # живёт там, и второй её реализации быть не должно.
      CONTENT_SERVICE_URL: ${CONTENT_SERVICE_URL:-http://tessera-v2-collab:3001}
      # Тот же секрет, что у соседа. Пустое значение выключает внутренние
      # маршруты совместного редактирования вовсе.
      COLLAB_INTERNAL_TOKEN: ${COLLAB_INTERNAL_TOKEN:?COLLAB_INTERNAL_TOKEN обязателен}
      # Приёмник счётчиков установки. Внутри сети развёртывания: наружу
      # телеметрия не уходит. Пустое значение выключает отправку.
      HUB_INTERNAL_URL: ${HUB_INTERNAL_URL:-http://tessera-v2-hub:4000}
      # Тот же сосед, но адресом для браузера: по нему открывается страница
      # выпусков. Внутреннее имя сети в браузере человека не разрешается.
      HUB_URL: ${HUB_URL:-http://localhost:4000}
      DISABLE_TELEMETRY: ${DISABLE_TELEMETRY:-false}
    ports:
      - "3100:3000"
    restart: unless-stopped

  # Экраны. Отдельный процесс, а не часть приложения: это сервер отрисовки на
  # Node, и в одном процессе с Python ему делать нечего.
  #
  # Он же отдаёт страницу отрисовки, которую печатает Gotenberg: разметка
  # страницы живёт здесь, и второй её рисовальщик расходился бы с тем, что
  # человек видит на экране.
  tessera-v2-web:
    build:
      context: ../web
      dockerfile: Dockerfile
    container_name: tessera-v2-web
    depends_on:
      - tessera-v2-api
    environment:
      # Два адреса, а не один. Браузер ходит на то же происхождение, что и
      # страница, поэтому здесь пусто; сервер отрисовки ходит к приложению
      # внутренним именем — относительный адрес там уводит запрос обратно в
      # себя и кончается переполнением памяти.
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://tessera-v2-api:3000}
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      # Экраны отдаёт обратный прокси: наружу открывается только он, а сюда
      # ходит он же по петле.
      - "3102:3000"
    restart: unless-stopped

  # Разбор очереди заданий. Отдельный процесс: задание может выполняться
  # минутами, и выполнение его внутри веб-процесса означает, что выкладка
  # обрывает его на середине.
  tessera-v2-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tessera-v2-worker
    command: ["arq", "tessera_api.worker.WorkerSettings"]
    depends_on:
      - tessera-v2-db
      - tessera-v2-redis
    environment:
      # Адрес, по которому страница открыта в браузере, — и никакой иной.
      # По нему проверяется происхождение при рукопожатии канала событий: при
      # расхождении соединение отвергается молча, страницы работают, а живые
      # обновления просто не приходят. За обратным прокси здесь стоит внешний
      # адрес вики, а не порт на петле.
      APP_URL: ${APP_URL:-http://localhost:3100}
      APP_SECRET: ${APP_SECRET:?APP_SECRET обязателен, не короче 32 символов}
      DATABASE_URL: ${DATABASE_URL:-postgresql://tessera:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD обязателен}@tessera-v2-db:5432/tessera}
      REDIS_URL: ${REDIS_URL:-redis://tessera-v2-redis:6379}
      MAIL_DRIVER: ${MAIL_DRIVER:-log}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@tessera.local}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Tessera}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
      STORAGE_LOCAL_PATH: ${STORAGE_LOCAL_PATH:-/app/data/storage}
      AWS_S3_ENDPOINT: ${AWS_S3_ENDPOINT:-http://tessera-v2-minio:9000}
      AWS_S3_BUCKET: ${MINIO_BUCKET:-tessera}
      AWS_S3_REGION: ${MINIO_REGION:-us-east-1}
      AWS_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-tessera}
      AWS_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD обязателен}
      AWS_S3_FORCE_PATH_STYLE: ${AWS_S3_FORCE_PATH_STYLE:-true}
      FILE_UPLOAD_SIZE_LIMIT: ${FILE_UPLOAD_SIZE_LIMIT:-50mb}
      # Ввозимый архив крупнее обычного вложения: в нём целое пространство.
      FILE_IMPORT_SIZE_LIMIT: ${FILE_IMPORT_SIZE_LIMIT:-200mb}
      # Провайдер ИИ. Применяется только к пространству, которое не выбрало
      # провайдера само: как только выбрало, отсюда не наследуется ничего,
      # включая имена моделей — они у провайдеров несовместимы.
      AI_DRIVER: ${AI_DRIVER:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OLLAMA_API_URL: ${OLLAMA_API_URL:-}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-}
      AI_COMPLETION_MODEL: ${AI_COMPLETION_MODEL:-}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-}
      # Соседний сервис преобразования содержимого. Схема узлов редактора
      # живёт там, и второй её реализации быть не должно.
      CONTENT_SERVICE_URL: ${CONTENT_SERVICE_URL:-http://tessera-v2-collab:3001}
      # Печать в PDF. Пустой адрес Gotenberg выключает выгрузку целиком.
      GOTENBERG_URL: ${GOTENBERG_URL:-http://tessera-v2-gotenberg:3000}
      # Откуда браузер печати берёт страницу отрисовки. Внутреннее имя, а не
      # внешний адрес: наружу он не ходит.
      PDF_RENDER_BASE_URL: ${PDF_RENDER_BASE_URL:-http://tessera-v2-web:3000}
      PDF_EXPORT_TIMEOUT: ${PDF_EXPORT_TIMEOUT:-120}
    restart: unless-stopped

  # Хранилище вложений, совместимое с протоколом S3.
  tessera-v2-minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: tessera-v2-minio
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-tessera}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD обязателен}
    restart: unless-stopped
    volumes:
      - tessera_v2_minio_data:/data

  # Внутренний сервис: версии, телеметрия, документация, лицензия. Написан на
  # Python и Litestar, правки не требует — берётся как есть. Наружу порт не
  # публикуется: к нему ходит только приложение.
  tessera-v2-hub:
    build:
      context: ../../services/hub
    container_name: tessera-v2-hub
    depends_on:
      - tessera-v2-hub-db
    environment:
      HUB_DATABASE_URL: postgresql+asyncpg://tessera_hub:${HUB_POSTGRES_PASSWORD:-${POSTGRES_PASSWORD}}@tessera-v2-hub-db:5432/tessera_hub
      HOST: 0.0.0.0
      PORT: 4000
    restart: unless-stopped

  tessera-v2-hub-db:
    image: postgres:18-alpine
    container_name: tessera-v2-hub-db
    environment:
      POSTGRES_DB: tessera_hub
      POSTGRES_USER: tessera_hub
      POSTGRES_PASSWORD: ${HUB_POSTGRES_PASSWORD:-${POSTGRES_PASSWORD:?POSTGRES_PASSWORD обязателен}}
    restart: unless-stopped
    volumes:
      - tessera_v2_hub_db_data:/var/lib/postgresql

  # Поиск в интернете для агента. Свой сервис, а не чужая услуга: ключа он не
  # требует, счёта в закрытом контуре не заводит и хранить найденное не
  # запрещает. Наружу не публикуется — ходит к нему только приложение.
  tessera-v2-searxng:
    image: searxng/searxng@sha256:f4c8e59de166ed71f6380c0847c312ca51f0d41996e31d0559163b6b09ecde52
    container_name: tessera-v2-searxng
    environment:
      SEARXNG_BASE_URL: http://tessera-v2-searxng:8080/
      SEARXNG_SECRET: ${SEARXNG_SECRET:-tessera-v2-searxng-secret}
    volumes:
      - ../../deploy/searxng:/etc/searxng:ro
    restart: unless-stopped

  # Безголовый Chromium: им и только им печатаются страницы в PDF. Разметка
  # страницы живёт на клиенте, и второй её рисовальщик на сервере расходился бы
  # с тем, что человек видит на экране.
  #
  # Список разрешённых адресов сужен до собственного маршрута отрисовки: браузер
  # печати не должен ходить никуда, кроме него, — иначе ссылка внутри страницы
  # превращает его в средство обхода сети развёртывания.
  tessera-v2-gotenberg:
    image: gotenberg/gotenberg:8
    container_name: tessera-v2-gotenberg
    command:
      - "gotenberg"
      - "--chromium-allow-list=^http://tessera-v2-web:3000/pdf-render/.*"
      - "--chromium-disable-javascript=false"
    restart: unless-stopped

  tessera-v2-db:
    image: pgvector/pgvector:pg18
    container_name: tessera-v2-db
    environment:
      POSTGRES_DB: tessera
      POSTGRES_USER: tessera
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD обязателен}
    restart: unless-stopped
    volumes:
      - tessera_v2_db_data:/var/lib/postgresql

  tessera-v2-redis:
    image: redis:8
    container_name: tessera-v2-redis
    restart: unless-stopped
    volumes:
      - tessera_v2_redis_data:/data

volumes:
  tessera_v2_db_data:
  tessera_v2_hub_db_data:
  tessera_v2_minio_data:
  tessera_v2_redis_data:
