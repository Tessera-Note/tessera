# Боевой состав второй версии: только её процессы.
#
# База, Redis, хранилище вложений, Gotenberg, drawio и внутренний сервис берутся
# те же, что у первой версии. Это не экономия, а условие всего перехода: данные
# не переносятся, обе версии работают с одной базой и одним хранилищем, и
# переключение сводится к смене адресата в обратном прокси. Свои база и
# хранилище означали бы переезд данных, а откат — переезд обратно.
#
# Стенд для репетиции — `docker-compose.v2.yml`: там у второй версии всё своё.
#
# Как поднимать:
#
#     docker compose -f apps/api/docker-compose.v2.server.yml up -d
#
# Ожидает, что первая версия уже поднята корневым docker-compose.yml: её сеть
# подключается сюда внешней.
name: tessera-v2

# Сеть первой версии. Внешняя, а не своя: по внутренним именам её сервисов
# (`tessera-db`, `tessera-redis`, `tessera-minio`) вторая версия и обращается.
# Имя сети складывается из имени проекта первой версии и `_default`.
networks:
  default:
    name: ${V1_NETWORK:-tessera_default}
    external: true

services:
  # Преобразование содержимого страниц и канал совместного редактирования.
  # Своё, а не общее с первой версией: у них разные схемы узлов не бывают, но
  # разные протоколы — бывают, и первая версия свой канал держит внутри
  # приложения.
  #
  # **A second replica is admissible, under two conditions.** A document lives
  # in the memory of one process and there is no broadcast between replicas, but
  # none is needed: the proxy pins every connection of a document to one replica
  # by the `documentName` argument, and an ownership mark in Redis holds it
  # there. Measured on the stand on 17 September 2026 with two replicas and two
  # open documents: the marks named one replica, the other held nothing, and
  # both documents converged and reached the database.
  #
  # The conditions: the unnamed-document allowance stays off, and the proxy is
  # restarted rather than reloaded when the set of replicas changes. The order
  # is in `docs/ai-context/collaboration-realtime.md`.
  tessera-v2-collab:
    extends:
      file: docker-compose.v2.yml
      service: tessera-v2-collab

  tessera-v2-api:
    extends:
      file: docker-compose.v2.yml
      service: tessera-v2-api
    environment:
      # База и Redis первой версии. Имена — её внутренние имена в общей сети.
      DATABASE_URL: ${DATABASE_URL:-postgresql://tessera:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD обязателен}@tessera-db:5432/tessera}
      REDIS_URL: ${REDIS_URL:-redis://tessera-redis:6379}
      # Хранилище вложений первой версии: вложения у версий общие, и второе
      # хранилище означало бы, что половина картинок не открывается.
      AWS_S3_ENDPOINT: ${AWS_S3_ENDPOINT:-http://tessera-minio:9000}
      # Внутренний сервис первой версии: версии, телеметрия, документация.
      HUB_INTERNAL_URL: ${HUB_INTERNAL_URL:-http://tessera-hub:4000}
      # Адрес, по которому вики открыта в браузере. Обязателен и обязан
      # совпадать: по нему проверяется происхождение при рукопожатии канала
      # событий, и расхождение отвергает соединение молча.
      APP_URL: ${APP_URL:?APP_URL обязателен и обязан совпадать с адресом вики}
    depends_on: !reset []

  tessera-v2-web:
    extends:
      file: docker-compose.v2.yml
      service: tessera-v2-web
    depends_on: !reset []

  tessera-v2-worker:
    extends:
      file: docker-compose.v2.yml
      service: tessera-v2-worker
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://tessera:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD обязателен}@tessera-db:5432/tessera}
      REDIS_URL: ${REDIS_URL:-redis://tessera-redis:6379}
      AWS_S3_ENDPOINT: ${AWS_S3_ENDPOINT:-http://tessera-minio:9000}
      APP_URL: ${APP_URL:?APP_URL обязателен и обязан совпадать с адресом вики}
      # Печать в PDF первой версии. Её список разрешённых адресов сужен до
      # собственного маршрута (`--chromium-allow-list=^http://tessera:3000/.*`),
      # и страницу второй версии он не пропустит. Поэтому для печати поднимается
      # свой Gotenberg.
      GOTENBERG_URL: ${GOTENBERG_URL:-http://tessera-v2-gotenberg:3000}
      # **Адрес обязан отдавать и страницу, и `/api/files/`, и `/_app/`.**
      # Страница отрисовки показывает документ редактором, а он приходит из
      # `/_app/`; вложения — из `/api/files/`. Адрес одного веб-контейнера ни
      # того, ни другого не отдаёт: печатается плоский текст без картинок.
      # На стенде это прокси; здесь адрес задаётся при переключении вместе с
      # `PDF_ALLOW_LIST` — списком разрешённых адресов того же узла.
      PDF_RENDER_BASE_URL: ${PDF_RENDER_BASE_URL:-http://tessera-v2-web:3000}
    depends_on: !reset []

  # Свой Gotenberg, и это единственная вспомогательная служба, которая не
  # берётся у первой версии. Причина в списке разрешённых адресов: у неё он
  # сужен до её собственного маршрута отрисовки, а сужение — не украшение, оно
  # не даёт браузеру печати ходить по сети развёртывания. Расширять чужой
  # список ради второй версии значит ослаблять первую.
  tessera-v2-gotenberg:
    extends:
      file: docker-compose.v2.yml
      service: tessera-v2-gotenberg
