[project]
name = "tessera-api"
version = "0.1.0"
description = "Бэкенд Tessera v2: Litestar, SQLAlchemy 2.0 async, msgspec"
requires-python = ">=3.13"
dependencies = [
    "litestar[standard]==2.24.0",
    "sqlalchemy[asyncio]==2.0.51",
    "asyncpg==0.31.0",
    "redis==6.4.0",
    "msgspec==0.19.0",
    "pyjwt==2.12.1",
    "bcrypt==5.0.0",
    "arq==0.25.0",
    "aiobotocore==3.9.0",
    "cryptography==50.0.0",
    "ldap3==2.9.1",
    "signxml==5.1.0",
    "python-socketio==5.16.4",
    "pypdf==6.15.0",
    "python-docx==1.2.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.1",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tessera_api"]
