<!doctype html>
<html lang="%tessera.locale%" data-theme="%tessera.theme%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" />
    <script>
      // Тема выбирается до отрисовки. Отложенный до загрузки приложения выбор
      // виден вспышкой светлого экрана у того, кто работает в тёмной теме.
      (function () {
        try {
          var saved = localStorage.getItem('tessera.theme');
          var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = saved === 'light' || saved === 'dark' ? saved : dark ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (error) {
          // Хранилище недоступно в закрытом окне или при запрете сторонних
          // данных. Тема останется той, что подставил сервер.
        }
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
