<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}{{ product_name }}{% endblock %}</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1a1b1e;
        --muted: #6b7280;
        --line: #e5e7eb;
        --accent: #1b72f2;
        --code-bg: #f4f5f7;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #16181c;
          --fg: #e9ecef;
          --muted: #9aa4b2;
          --line: #2c2e33;
          --accent: #6ea6f6;
          --code-bg: #1f2126;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 2rem 1rem 4rem;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      }
      main { max-width: 46rem; margin: 0 auto; }
      header { max-width: 46rem; margin: 0 auto 2rem; }
      header a { color: var(--muted); text-decoration: none; font-size: 0.9rem; }
      header a:hover { color: var(--accent); }
      h1 { font-size: 1.7rem; margin: 0 0 1rem; }
      h2 { font-size: 1.25rem; margin: 2rem 0 0.75rem; }
      a { color: var(--accent); }
      code {
        background: var(--code-bg);
        padding: 0.1rem 0.3rem;
        border-radius: 4px;
        font-size: 0.9em;
      }
      pre {
        background: var(--code-bg);
        padding: 0.9rem 1rem;
        border-radius: 8px;
        overflow-x: auto;
      }
      pre code { background: none; padding: 0; }
      table { border-collapse: collapse; width: 100%; }
      th, td { border: 1px solid var(--line); padding: 0.5rem 0.7rem; text-align: left; }
      ul { padding-left: 1.2rem; }
      .meta { color: var(--muted); font-size: 0.85rem; }
      .card {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 1rem 1.2rem;
        margin-bottom: 1rem;
      }
      .badge {
        display: inline-block;
        background: var(--accent);
        color: #fff;
        border-radius: 999px;
        padding: 0.05rem 0.6rem;
        font-size: 0.75rem;
        vertical-align: middle;
      }
    </style>
  </head>
  <body>
    <header><a href="{{ base_url }}/docs">{{ product_name }}</a></header>
    <main>{% block content %}{% endblock %}</main>
  </body>
</html>
