# Search settings for the Tessera AI assistant.
#
# They inherit from the defaults of the image; only what is necessary is
# overridden. The file lives in the repository rather than being edited in a
# volume: a deployment has to be reproducible.
use_default_settings: true

server:
  # The form signing key.
  #
  # The value is literal rather than taken from the environment: the image
  # substitutes `SEARXNG_SECRET` by editing this very file at startup, and the
  # file is mounted read-only, so the substitution does not go through. That is
  # why the `SEARXNG_SECRET` variable in compose affects nothing.
  #
  # This is acceptable because the service is not published outside and is
  # reachable only from the compose network, and the key signs the form state of
  # the SearXNG interface of its own, which nobody here uses: the application
  # only ever asks for `format=json`. If the service is ever opened outside, the
  # key will have to be moved into a writable volume.
  secret_key: "tessera-searxng-secret"
  # Without this SearXNG answers 403 to any request with format=json, and the
  # assistant needs exactly the machine format.
  limiter: false
  image_proxy: false

search:
  # JSON is off by default. The assistant only ever asks for it.
  formats:
    - html
    - json

# The engines that tolerate calls from a data centre address. Google and
# DuckDuckGo regularly serve a captcha from here and go into suspended, so they
# are not in the set.
engines:
  - name: google
    disabled: true
  - name: duckduckgo
    disabled: true
