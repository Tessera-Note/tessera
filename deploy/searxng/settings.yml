# Настройки поиска для ИИ агента Tessera.
#
# Наследуются от умолчаний образа, переопределяется только необходимое.
# Файл лежит в репозитории, а не правится в томе: развертывание должно быть
# воспроизводимым.
use_default_settings: true

server:
  # Ключ подписи форм.
  #
  # Значение литеральное, а не из окружения: образ подставляет `SEARXNG_SECRET`
  # правкой этого же файла на старте, а он смонтирован только на чтение, и
  # подстановка не проходит. Переменная `SEARXNG_SECRET` в compose поэтому ни
  # на что не влияет.
  #
  # Приемлемо потому, что сервис не публикуется наружу и доступен только из
  # сети compose, а ключ подписывает состояние форм собственного интерфейса
  # SearXNG, которым здесь никто не пользуется: приложение ходит только за
  # `format=json`. Если сервис когда-нибудь откроют наружу, ключ надо будет
  # выносить в том с правом записи.
  secret_key: "tessera-searxng-secret"
  # Без этого SearXNG отвечает 403 на любой запрос с format=json, а агенту
  # нужен именно машинный формат.
  limiter: false
  image_proxy: false

search:
  # JSON по умолчанию выключен. Агент ходит только за ним.
  formats:
    - html
    - json

# Движки, устойчивые к обращениям с датацентрового адреса. Google и
# DuckDuckGo отсюда регулярно отдают капчу и уходят в suspended, поэтому в
# наборе их нет.
engines:
  - name: google
    disabled: true
  - name: duckduckgo
    disabled: true
