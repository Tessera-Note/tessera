# The reverse proxy for a deployment behind a domain with TLS.
#
# Three processes stand behind one address rather than one: the pages are served
# by the render server on Node, `/api` and the event channel by the application
# on Python, `/collab` by the collaborative editing service. The browser must not
# know about that: the origin is one, otherwise the sign-in cookie becomes
# third-party.
#
# The order of the sections matters: nginx picks the longest matching path, so
# `/api` and `/collab` are listed before the root section.

# Pinning the editing connections to a replica by the document name.
#
# The collaborative editing service holds an open document in the memory of the
# process, and two replicas with the same document would diverge silently: each
# would save its own text. So every connection for one document must arrive in
# one process. The key is the `documentName` argument of the address: the first
# protocol message, where the name is meant for the service itself, is not parsed
# by the proxy, while the address is visible to it. The service compares the
# argument against the name from the protocol and refuses a mismatch, so the
# pinning key and the open document always agree.
#
# `consistent` is there so that adding a replica moves only a share of the
# documents rather than shuffling all of them. When changing the set of replicas,
# restart the proxy rather than re-reading the configuration (`nginx -s reload`):
# a re-read configuration does not touch open connections, and a document that
# moved to a new replica would go on living on the old one too.
upstream tessera_v2_collab {
    hash $arg_documentName consistent;
    server 127.0.0.1:__COLLAB_PORT__;
}

server {
    listen 80;
    listen [::]:80;
    server_name __APP_DOMAIN__;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __APP_DOMAIN__;

    ssl_certificate /etc/letsencrypt/live/__APP_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__APP_DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Twenty megabytes more than the declared import limit (200 MB). Exactly the
    # same value would mean that an archive of the limit size is refused by the
    # proxy with a 413 before the application answers with its own failure: a
    # multipart body is larger than the file itself by the wrapping. The declared
    # limit would be unreachable, and the reason would not be named.
    client_max_body_size 220m;

    # The buffer for the response headers. The nginx default is four kilobytes,
    # and the page renderer does not fit into it: SvelteKit lists every part of
    # the page for preloading in the `Link` header, and the page screen has
    # dozens of them. It shows up as a 502 "upstream sent too big header" on one
    # screen out of forty — the one with the most parts.
    proxy_buffer_size 32k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;

    # The application: the API routes and the Socket.IO event channel.
    location /api/ {
        proxy_pass http://127.0.0.1:__API_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Exporting a space and printing to PDF take minutes.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:__API_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Collaborative editing: a web socket, the connection lives for hours.
    location /collab {
        proxy_pass http://tessera_v2_collab;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # The internal service: documentation, releases, license, support.
    location /hub/ {
        proxy_pass http://127.0.0.1:__HUB_PORT__/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # The diagram editor, embedded into the page editor.
    location /drawio/ {
        proxy_pass http://127.0.0.1:__DRAWIO_PORT__/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # The language dictionaries. Revalidation is mandatory, and here is why: the
    # file names never change while the contents change with every release. With
    # no instruction the browser caches them at its own discretion and does not
    # revalidate — after an update a person sees the old labels, and the new ones
    # show up as English keys. Measured: the cache still held an older set of
    # keys than the file.
    #
    # `no-cache` does not forbid caching, it requires revalidation: the ordinary
    # answer is a 304 with no body.
    location /locales/ {
        proxy_pass http://127.0.0.1:__WEB_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "no-cache" always;
    }

    # The screens. Last: everything not parsed above lands here.
    location / {
        proxy_pass http://127.0.0.1:__WEB_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
