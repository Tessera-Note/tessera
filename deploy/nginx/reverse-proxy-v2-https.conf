# Обратный прокси для второй версии.
#
# Отличие от первой в том, что за одним адресом стоят три процесса, а не один:
# страницы отдаёт сервер отрисовки на Node, `/api` и канал событий — приложение
# на Python, `/collab` — сервис совместного редактирования. Браузер об этом
# знать не должен: происхождение одно, иначе кука входа становится сторонней.
#
# Порядок разделов важен: nginx выбирает самое длинное совпадение пути, поэтому
# `/api` и `/collab` перечислены до корневого раздела.

# Закрепление соединений редактирования за репликой по имени документа.
#
# Сервис совместного редактирования держит открытый документ в памяти процесса,
# и две реплики с одним документом разошлись бы молча: каждая сохраняла бы свой
# текст. Поэтому все соединения по одному документу обязаны приходить в один
# процесс. Ключ — довод адреса `documentName`: первое сообщение протокола, где
# имя идёт для самого сервиса, прокси не разбирает, а адрес видит. Сервис
# сверяет довод с именем из протокола и расхождение отвергает, так что ключ
# закрепления и открытый документ совпадают всегда.
#
# `consistent` — чтобы добавление реплики переносило лишь долю документов, а не
# перемешивало все. Меняя состав реплик, прокси перезапускать, а не перечитывать
# (`nginx -s reload`): перечитанная настройка не трогает открытых соединений, и
# документ, переехавший на новую реплику, остался бы жить и на старой.
upstream tessera_v2_collab {
    hash $arg_documentName consistent;
    server 127.0.0.1:__COLLAB_PORT__;
}

server {
    listen 80;
    listen [::]:80;
    server_name __APP_DOMAIN__;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __APP_DOMAIN__;

    ssl_certificate /etc/letsencrypt/live/__APP_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__APP_DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # На двадцать мегабайт больше объявленного предела ввоза (200 МБ). Ровно
    # столько же означало бы, что архив предельного размера отвергается прокси
    # с 413 раньше, чем приложение ответит своим отказом: многочастное тело
    # крупнее самого файла на обвязку. Объявленный предел был бы недостижим, а
    # причина — не названа.
    client_max_body_size 220m;

    # Буфер под заголовки ответа. Умолчание nginx — четыре килобайта, и
    # отрисовщик страниц в него не влезает: SvelteKit перечисляет в заголовке
    # `Link` все части страницы для предзагрузки, а их у экрана страницы
    # десятки. Проявляется отказом 502 «upstream sent too big header» на одном
    # экране из сорока — на том, где частей больше всего.
    proxy_buffer_size 32k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;

    # Приложение: маршруты API и канал событий Socket.IO.
    location /api/ {
        proxy_pass http://127.0.0.1:__API_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Выгрузка пространства и печать в PDF идут минутами.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:__API_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Совместное редактирование: веб-сокет, соединение живёт часами.
    location /collab {
        proxy_pass http://tessera_v2_collab;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Внутренний сервис: документация, выпуски, лицензия, поддержка.
    location /hub/ {
        proxy_pass http://127.0.0.1:__HUB_PORT__/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Редактор диаграмм, встраивается в редактор страниц.
    location /drawio/ {
        proxy_pass http://127.0.0.1:__DRAWIO_PORT__/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Словари языков. Перепроверять обязательно, и вот почему: имена файлов
    # неизменны, а содержимое меняется с каждой выкладкой. Браузер без
    # указания кеширует их по своему усмотрению и не перепроверяет — человек
    # после обновления вики видит прежние подписи, а новые показываются
    # английскими ключами. Замерено: в кеше оставалось 2288 ключей при 2295 в
    # файле.
    #
    # `no-cache` не запрещает кеш, а требует перепроверки: обычный ответ — 304
    # без тела.
    location /locales/ {
        proxy_pass http://127.0.0.1:__WEB_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "no-cache" always;
    }

    # Экраны. Последним: сюда попадает всё, что не разобрано выше.
    location / {
        proxy_pass http://127.0.0.1:__WEB_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
