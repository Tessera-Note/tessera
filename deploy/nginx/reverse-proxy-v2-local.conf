# Обратный прокси второй версии для локального развёртывания.
#
# Отличие от `reverse-proxy-v2-https.conf` только в двух вещах: здесь нет TLS и
# нет домена — вика открывается по `http://localhost:8080`, — а адресаты
# называются внутренними именами сети compose, а не петлёй с портами. Разбор
# путей и порядок разделов те же: они и есть предмет проверки, и расходиться им
# нельзя.
#
# Зачем прокси вообще нужен на своей машине. За одним адресом стоят три
# процесса: страницы отдаёт сервер отрисовки, `/api` и канал событий —
# приложение, `/collab` — сервис совместного редактирования. Без прокси браузер
# ходил бы на три разных происхождения, и кука входа стала бы сторонней: её не
# отправят ни к `/api`, ни к `/collab`. Это не украшение, а условие работы.
#
# Порядок разделов важен: nginx выбирает самое длинное совпадение пути, поэтому
# `/api` и `/collab` перечислены до корневого раздела.

server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # На двадцать мегабайт больше объявленного предела ввоза (200 МБ). Ровно
    # столько же означало бы, что архив предельного размера отвергается прокси
    # с 413 раньше, чем приложение ответит своим отказом: многочастное тело
    # крупнее самого файла на обвязку. Объявленный предел был бы недостижим, а
    # причина — не названа.
    client_max_body_size 220m;

    # Приложение: маршруты API и канал событий Socket.IO.
    location /api/ {
        proxy_pass http://tessera-v2-api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Выгрузка пространства и печать в PDF идут минутами.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /socket.io/ {
        proxy_pass http://tessera-v2-api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Совместное редактирование: веб-сокет, соединение живёт часами.
    location /collab {
        proxy_pass http://tessera-v2-collab:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Внутренний сервис: документация, выпуски, лицензия, поддержка.
    location /hub/ {
        proxy_pass http://tessera-v2-hub:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Редактор диаграмм, встраивается в редактор страниц.
    location /drawio/ {
        proxy_pass http://tessera-v2-drawio:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Словари языков. Перепроверять обязательно, и вот почему: имена файлов
    # неизменны, а содержимое меняется с каждой выкладкой. Браузер без
    # указания кеширует их по своему усмотрению и не перепроверяет — человек
    # после обновления вики видит прежние подписи, а новые показываются
    # английскими ключами. Замерено: в кеше оставалось 2288 ключей при 2295 в
    # файле.
    #
    # `no-cache` не запрещает кеш, а требует перепроверки: обычный ответ — 304
    # без тела.
    location /locales/ {
        proxy_pass http://tessera-v2-web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache" always;
    }

    # Экраны. Последним: сюда попадает всё, что не разобрано выше.
    location / {
        proxy_pass http://tessera-v2-web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
