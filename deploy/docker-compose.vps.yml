services:
  tessera:
    image: ${WEB_IMAGE:?defina WEB_IMAGE}
    depends_on:
      tessera-db:
        condition: service_healthy
      tessera-redis:
        condition: service_healthy
      # Not a hard dependency: only PDF export needs it, and the app must still
      # come up if the renderer is unhealthy.
      tessera-gotenberg:
        condition: service_started
    environment:
      APP_URL: ${APP_URL:?defina APP_URL}
      APP_SECRET: ${APP_SECRET:?defina APP_SECRET}
      DATABASE_URL: postgresql://tessera:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}@tessera-db:5432/tessera
      REDIS_URL: redis://tessera-redis:6379
      PORT: 3000
      HOST: 0.0.0.0
      AI_DRIVER: ${AI_DRIVER:-openai}
      AI_COMPLETION_MODEL: ${AI_COMPLETION_MODEL:-gpt-4o-mini}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-gpt-4o-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OLLAMA_API_URL: ${OLLAMA_API_URL:-}
      GOTENBERG_URL: http://tessera-gotenberg:3000
      PDF_RENDER_BASE_URL: http://tessera:3000
      HUB_INTERNAL_URL: http://tessera-hub:4000
      HUB_URL: ${HUB_URL:-${APP_URL}/hub}
      DRAWIO_URL: ${DRAWIO_URL:-${APP_URL}/drawio}
      STORAGE_DRIVER: s3
      AWS_S3_ENDPOINT: http://tessera-minio:9000
      AWS_S3_BUCKET: ${MINIO_BUCKET:-tessera}
      AWS_S3_REGION: ${MINIO_REGION:-us-east-1}
      AWS_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-tessera}
      AWS_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD}
      AWS_S3_FORCE_PATH_STYLE: "true"
      # Unset MAIL_DRIVER falls back to the log driver, which drops mail
      # silently in production. Keep these in sync with deploy.yml.
      MAIL_DRIVER: ${MAIL_DRIVER:-log}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Tessera}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    restart: unless-stopped
    volumes:
      - tessera:/app/data/storage
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "http://127.0.0.1:3000/api/health/live",
        ]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s

  tessera-db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: tessera
      POSTGRES_USER: tessera
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      HUB_POSTGRES_PASSWORD: ${HUB_POSTGRES_PASSWORD:-${POSTGRES_PASSWORD}}
    restart: unless-stopped
    volumes:
      - tessera_db_data:/var/lib/postgresql
      # Отрабатывает только при первичной инициализации пустого каталога данных.
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tessera -d tessera"]
      interval: 10s
      timeout: 5s
      retries: 10

  tessera-db-backup:
    # Same image as db so pg_dump matches the server version exactly.
    image: pgvector/pgvector:pg18
    depends_on:
      tessera-db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    # Bypass the postgres entrypoint; this container only runs the dump loop.
    entrypoint: ["/bin/bash", "/usr/local/bin/backup-db.sh"]
    restart: unless-stopped
    volumes:
      - ./backup-db.sh:/usr/local/bin/backup-db.sh:ro
      # Host path, not a named volume: dumps must survive `docker volume rm`
      # and be trivially copied off the box.
      - ../backups:/backups

  # Headless Chromium, used only to render page exports to PDF. Kept out of the
  # app image so the image stays small on every deploy, and so a heavy render
  # cannot starve the app of memory.
  tessera-gotenberg:
    image: gotenberg/gotenberg:8
    command:
      - "gotenberg"
      # It should only ever fetch this app's own render route.
      - "--chromium-allow-list=^http://tessera:3000/.*"
    restart: unless-stopped
    # A render is short-lived; this keeps a runaway one from taking the box down.
    mem_limit: 1g

  tessera-redis:
    image: redis:8
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory-policy",
        "noeviction",
      ]
    restart: unless-stopped
    volumes:
      - tessera_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  tessera-hub:
    image: ${HUB_IMAGE:?defina HUB_IMAGE}
    depends_on:
      tessera-db:
        condition: service_healthy
    environment:
      HUB_DATABASE_URL: postgresql+asyncpg://tessera_hub:${HUB_POSTGRES_PASSWORD:-${POSTGRES_PASSWORD}}@tessera-db:5432/tessera_hub
      HUB_PRODUCT_NAME: ${HUB_PRODUCT_NAME:-Tessera}
      HUB_PUBLIC_URL: ${HUB_URL:-${APP_URL}/hub}
      HUB_SUPPORT_EMAIL: ${HUB_SUPPORT_EMAIL:-support@tessera.local}
      HUB_SEED_RELEASE_VERSION: ${HUB_SEED_RELEASE_VERSION:-}
    ports:
      - "127.0.0.1:${HUB_PORT:-4000}:4000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/live')"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 20s

  tessera-drawio:
    image: jgraph/drawio:24.7.17
    environment:
      DRAWIO_SELF_CONTAINED: "1"
    ports:
      - "127.0.0.1:${DRAWIO_PORT:-8081}:8080"
    restart: unless-stopped
    mem_limit: 1g

  tessera-minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-tessera}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD}
    restart: unless-stopped
    volumes:
      - tessera_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 20s

  tessera-minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      tessera-minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-tessera}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-tessera}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set tessera http://tessera-minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "tessera/$$MINIO_BUCKET"
    restart: "no"

volumes:
  tessera:
  tessera_db_data:
  tessera_redis_data:
  tessera_minio_data:
