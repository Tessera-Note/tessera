services:
  tessera:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - tessera-db
      - tessera-redis
    environment:
      APP_URL: ${APP_URL:-http://localhost:3000}
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: postgresql://tessera:${POSTGRES_PASSWORD}@tessera-db:5432/tessera
      REDIS_URL: redis://tessera-redis:6379
      GOTENBERG_URL: http://tessera-gotenberg:3000
      PDF_RENDER_BASE_URL: http://tessera:3000
      # Внутренние сервисы вместо сторонних адресов.
      HUB_INTERNAL_URL: http://tessera-hub:4000
      HUB_URL: ${HUB_URL:-http://localhost:4000}
      DRAWIO_URL: ${DRAWIO_URL:-http://localhost:8081}
      STORAGE_DRIVER: s3
      AWS_S3_ENDPOINT: http://tessera-minio:9000
      AWS_S3_BUCKET: ${MINIO_BUCKET:-tessera}
      AWS_S3_REGION: ${MINIO_REGION:-us-east-1}
      AWS_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-tessera}
      AWS_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD обязателен}
      AWS_S3_FORCE_PATH_STYLE: "true"
      # Вход через провайдера. Окружение передается контейнеру поименно,
      # поэтому переменная, отсутствующая здесь, до приложения не доходит,
      # даже если она задана в .env.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SAML_DISABLE_REQUESTED_AUTHN_CONTEXT: ${SAML_DISABLE_REQUESTED_AUTHN_CONTEXT:-false}
      # Аварийный вход по паролю при включенном принуждении SSO. Нужен ровно
      # тогда, когда провайдер сломан, поэтому обязан доходить до контейнера.
      SSO_EMERGENCY_PASSWORD_LOGIN: ${SSO_EMERGENCY_PASSWORD_LOGIN:-false}

      # Ниже переменные, которые приложение читает, а контейнер до этой правки
      # не получал: задать их файлом окружения было невозможно, значение молча
      # оставалось пустым.
      #
      # У пяти из них есть умолчание в коде, и оно продублировано здесь
      # намеренно. `ConfigService.get(ключ, умолчание)` отдает умолчание только
      # при отсутствии переменной, а пустая строка это заданное значение и
      # умолчание перебивает. Передать их пустыми означало бы сломать то, что
      # сейчас работает без настройки.
      MAIL_DRIVER: ${MAIL_DRIVER:-log}
      PORT: ${PORT:-3000}
      SEARCH_DRIVER: ${SEARCH_DRIVER:-database}
      EVENT_STORE_DRIVER: ${EVENT_STORE_DRIVER:-postgres}
      CLOUD: ${CLOUD:-false}

      # Остальные умолчания в коде не имеют либо читаются через `||` и `??`,
      # где пустая строка равносильна отсутствию.
      HOST: ${HOST:-}
      DEBUG_MODE: ${DEBUG_MODE:-}
      DEBUG_DB: ${DEBUG_DB:-}
      LOG_HTTP: ${LOG_HTTP:-}
      SUBDOMAIN_HOST: ${SUBDOMAIN_HOST:-}
      CLICKHOUSE_URL: ${CLICKHOUSE_URL:-}

      # Число обратных прокси перед приложением. По нему считаются пороги
      # частоты запросов и пишется адрес в журнал аудита.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}

      # Совместное редактирование.
      COLLAB_URL: ${COLLAB_URL:-}
      COLLAB_PORT: ${COLLAB_PORT:-}
      COLLAB_SHOW_STATS: ${COLLAB_SHOW_STATS:-}

      # Провайдер модели ИИ. Ключи можно задать и через интерфейс, они лежат в
      # базе зашифрованными, но код читает и окружение, и до этой правки
      # настроить их переменными было нельзя.
      AI_DRIVER: ${AI_DRIVER:-}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-}
      AI_COMPLETION_MODEL: ${AI_COMPLETION_MODEL:-}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-}
      AI_EMBEDDING_DIMENSION: ${AI_EMBEDDING_DIMENSION:-}
      AI_EMBEDDING_SUPPORTS_MRL: ${AI_EMBEDDING_SUPPORTS_MRL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_URL: ${OPENAI_API_URL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OLLAMA_API_URL: ${OLLAMA_API_URL:-}
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - tessera:/app/data/storage

  tessera-db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: tessera
      POSTGRES_USER: tessera
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      HUB_POSTGRES_PASSWORD: ${HUB_POSTGRES_PASSWORD:-${POSTGRES_PASSWORD}}
    restart: unless-stopped
    volumes:
      - tessera_db_data:/var/lib/postgresql
      # Отрабатывает только при первичной инициализации пустого каталога данных.
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro

  tessera-redis:
    image: redis:8
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
    volumes:
      - tessera_redis_data:/data

  # Headless Chromium used only to render page exports to PDF.
  tessera-gotenberg:
    image: gotenberg/gotenberg:8
    command:
      - "gotenberg"
      # Only ever asked to fetch this app's own render route.
      - "--chromium-allow-list=^http://tessera:3000/.*"
      - "--chromium-disable-javascript=false"
    restart: unless-stopped

  # Отдает версии, телеметрию, документацию, лицензию и страницу поддержки.
  tessera-hub:
    build:
      context: ./services/hub
      dockerfile: Dockerfile
    depends_on:
      - tessera-db
    environment:
      HUB_DATABASE_URL: postgresql+asyncpg://tessera_hub:${HUB_POSTGRES_PASSWORD:-${POSTGRES_PASSWORD}}@tessera-db:5432/tessera_hub
      HUB_PRODUCT_NAME: ${HUB_PRODUCT_NAME:-Tessera}
      HUB_PUBLIC_URL: ${HUB_URL:-http://localhost:4000}
      HUB_SUPPORT_EMAIL: ${HUB_SUPPORT_EMAIL:-support@tessera.local}
      HUB_SEED_RELEASE_VERSION: ${HUB_SEED_RELEASE_VERSION:-0.95.0}
    ports:
      - "4000:4000"
    restart: unless-stopped

  # Редактор диаграмм вместо публичного сервиса встраивания.
  tessera-drawio:
    image: jgraph/drawio:24.7.17
    environment:
      DRAWIO_SELF_CONTAINED: "1"
    ports:
      - "8081:8080"
    restart: unless-stopped

  # Поиск в интернете для ИИ агента.
  #
  # Свой сервис, а не внешний API: единственный вариант, не требующий ключа,
  # не создающий зависимости от чужого биллинга в закрытом контуре и не
  # ограничивающий право хранить найденное в теле страницы вики. Резервные
  # провайдеры (Tavily, Brave) подключаются ключом в настройках рабочего
  # пространства, когда своего индекса недостаточно.
  #
  # Наружу не публикуется: обращается к нему только `tessera` по внутренней
  # сети compose. Формат JSON включается явно, по умолчанию SearXNG отдаёт
  # только HTML.
  tessera-searxng:
    # Закреплено по digest, а не по подвижному тегу: воспроизводимость
    # развертывания важнее удобства обновления.
    image: searxng/searxng@sha256:f4c8e59de166ed71f6380c0847c312ca51f0d41996e31d0559163b6b09ecde52
    container_name: tessera-searxng
    environment:
      SEARXNG_BASE_URL: http://tessera-searxng:8080/
      # Ключ подписи форм. Значение произвольное, важна лишь неизменность
      # внутри одной установки.
      SEARXNG_SECRET: ${SEARXNG_SECRET:-tessera-searxng-secret}
    volumes:
      - ./deploy/searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng_data:/var/cache/searxng
    restart: unless-stopped

  # Хранилище вложений, совместимое с протоколом S3.
  tessera-minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-tessera}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD обязателен}
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped
    volumes:
      - tessera_minio_data:/data

  # Разовое создание бакета. Завершается после успеха и не перезапускается.
  tessera-minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      - tessera-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-tessera}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD обязателен}
      MINIO_BUCKET: ${MINIO_BUCKET:-tessera}
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set tessera http://tessera-minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do
          echo "жду tessera-minio"; sleep 2;
        done
        mc mb --ignore-existing "tessera/$$MINIO_BUCKET"
        echo "бакет $$MINIO_BUCKET готов"
    restart: "no"

volumes:
  searxng_data:
  tessera:
  tessera_db_data:
  tessera_redis_data:
  tessera_minio_data:
