# Translation synchronization is OFF. Do not turn it on before reading this to
# the end.
#
# The decision of 6 September 2026: the dictionaries are kept in the repository
# and Crowdin is not used. The reasoning: there are no outside translators, the
# instance is closed, and the twelve dictionaries are filled with translations
# made in the course of the work, which Crowdin does not have. The very first
# download would translate them back into English — silently, with no failure
# at all, because for Crowdin a missing translation is an empty translation.
#
# The entries below are commented out deliberately: with an empty `files` the
# `crowdin` command refuses to work, so an accidental run breaks nothing.
#
# What to do if the synchronization is needed after all, in exactly this order:
#   1. Upload the current `apps/web/static/locales/*.json` to Crowdin as
#      translations (`crowdin upload translations`), not as the source.
#   2. Confirm with a download into a separate branch that not a single key came
#      back English.
#   3. Only then uncomment the lines here and fix the rules in
#      `.claude/skills/i18n/SKILL.md` and `.claude/agents/i18n-reviewer.md`:
#      right now they say the dictionaries are kept in the repository and edited
#      directly.
#
files: []
#  - source: /apps/web/static/locales/en-US.json
#    translation: /apps/web/static/locales/%locale%.json
#    type: i18next_json
