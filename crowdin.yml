files:
  # Первая версия. Остаётся, пока она остаётся продом: снять её раньше значит
  # перестать обновлять переводы работающей вики.
  - source: /apps/client/public/locales/en-US/translation.json
    translation: /apps/client/public/locales/%locale%/%original_file_name%
    type: i18next_json

  # Вторая версия. Раскладка другая: у неё словарь на локаль лежит одним файлом
  # с именем локали, а не каталогом на локаль.
  #
  # Добавлена заранее, до смены прода, и это осознанно. Двенадцать словарей v2
  # заведены переводами, сделанными в работе, и вычитки носителями не проходили
  # — вычитка их улучшит. Отложить до смены прода значило бы, что синхронизация
  # в тот день уходит не туда, а заметить это нечем: файлы просто перестанут
  # обновляться.
  - source: /apps/web/static/locales/en-US.json
    translation: /apps/web/static/locales/%locale%.json
    type: i18next_json
