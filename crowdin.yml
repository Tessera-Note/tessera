# Синхронизация переводов ВЫКЛЮЧЕНА. Не включать, не прочитав это до конца.
#
# Решение от 6 сентября 2026: словари ведутся в репозитории, Crowdin не
# запускается. Довод: переводчиков со стороны нет, экземпляр закрытый, а
# двенадцать словарей второй версии заведены переводами, сделанными в работе, и
# в Crowdin их нет. Первая же выгрузка перевела бы их обратно в английский —
# молча, без единого отказа, потому что для Crowdin отсутствие перевода и есть
# пустой перевод.
#
# Записи ниже намеренно закомментированы: с пустым `files` команда `crowdin`
# отказывается работать, и случайный запуск ничего не портит.
#
# Что сделать, если синхронизацию всё-таки понадобится включить, ровно в этом
# порядке:
#   1. Загрузить нынешние `apps/web/static/locales/*.json` в Crowdin как
#      переводы (`crowdin upload translations`), а не как источник.
#   2. Убедиться выгрузкой в отдельную ветку, что ни один ключ не вернулся
#      английским.
#   3. Только после этого снять комментарии здесь и поправить правила в
#      `.claude/skills/i18n/SKILL.md` и `.claude/agents/i18n-reviewer.md`:
#      сейчас там написано, что словари ведутся в репозитории и правятся
#      напрямую.
#
files: []
